name: Publish visual-review website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @t3-designer/web typecheck
      - run: pnpm --filter @t3-designer/web lint
      - run: pnpm --filter @t3-designer/web test
      # This publishes the labeled nonmetric preview, not a validated BIM release.
      # The architecture release gate remains unchanged and blocked independently.
      - run: pnpm --filter @t3-designer/web build
        env:
          VITE_BASE_PATH: /home-zeballos/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy preview
        id: deployment
        uses: actions/deploy-pages@v4